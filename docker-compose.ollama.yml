# Runs Ollama inside Docker instead of on the host, and pulls the models on first start.
# Usage: docker compose -f docker-compose.yml -f docker-compose.ollama.yml up --build
# Trade-off: Docker on macOS has no GPU access, so answers are slower than with a host Ollama.
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - ollama pull ${OLLAMA_MODEL:-llama3.2:3b} && ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama-models:
